name: Build Image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login \
            -u "${{ secrets.REGISTRY_USER }}" \
            --password-stdin

      - name: Build CI image
        run: |
          docker build \
            -t jajalab/vite-project:${{ github.sha }} \
            -t jajalab/vite-project:latest \
            .

      - name: Push CI image
        run: |
          docker push jajalab/vite-project:${{ github.sha }}
          docker push jajalab/vite-project:latest
